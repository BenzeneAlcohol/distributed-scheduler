services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  scheduler:
    build:
      context: .
      target: scheduler
    environment:
      SCHEDULER_ADDRESS: :8080
      SCHEDULER_GRPC_ADDRESS: :9090
      DATABASE_URL: postgres://${POSTGRES_USER:-scheduler}:${POSTGRES_PASSWORD:-scheduler}@postgres:5432/${POSTGRES_DB:-scheduler}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9090:9090"

  worker:
    build:
      context: .
      target: worker
    environment:
      WORKER_SCHEDULER_ADDRESS: scheduler:9090
      WORKER_CAPACITY: ${WORKER_CAPACITY:-1}
    depends_on:
      scheduler:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
